---
- name: Cockpit aus den Backports installieren
  ansible.builtin.apt:
    name: "{{ cockpit_packages }}"
    default_release: trixie-backports
    state: present

- name: Ablage für Plugin-Pakete
  ansible.builtin.file:
    path: /var/cache/aunserver
    state: directory
    owner: root
    group: root
    mode: "0755"

# GitHub antwortet beim Herunterladen manchmal nicht rechtzeitig ("The read operation timed out",
# VM-Test von #68); ohne Wiederholung brach das ganze Setup ab
- name: Plugin-Pakete laden (SHA256 geprüft)
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/var/cache/aunserver/{{ item.url | basename }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 60
  loop: "{{ cockpit_plugins }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  register: cockpit_plugin_download
  until: cockpit_plugin_download is succeeded
  retries: 4
  delay: 20

- name: Plugins installieren
  ansible.builtin.apt:
    deb: "/var/cache/aunserver/{{ item.url | basename }}"
  loop: "{{ cockpit_plugins }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"

- name: Mitinstallierte NFS-Dienste abschalten
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ cockpit_masked_units }}"

# Einstellungen, Übernehmen, Verlauf und Passwörter im Browser (D22); schreibt nur über aunserver-config
- name: Seite aunserver in Cockpit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../cockpit/aunserver/"
    dest: /usr/share/cockpit/aunserver/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# AUN-Layout: Cockpit liest /etc/cockpit/branding vor dem Debian-Branding (ab Cockpit 347),
# das übersteht Paket-Updates. Dateien werden bei jedem Aufruf gelesen, kein Neustart nötig.
- name: Ordner für das Cockpit-Branding
  ansible.builtin.file:
    path: /etc/cockpit/branding
    state: "{{ 'directory' if aun_layout | bool else 'absent' }}"
    owner: root
    group: root
    mode: "0755"

- name: AUN-Layout für Cockpit (Logo, Favicon, Hintergrund der Anmeldeseite)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/cockpit/branding/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: "{{ playbook_dir }}/../cockpit/branding/branding.css", dest: branding.css }
    - { src: "{{ aun_layout_dir }}/system/cockpit-logo.png", dest: logo.png }
    - { src: "{{ aun_layout_dir }}/system/cockpit-favicon.ico", dest: favicon.ico }
    - { src: "{{ aun_layout_dir }}/system/cockpit-hintergrund.jpg", dest: hintergrund.jpg }
  loop_control:
    label: "{{ item.dest }}"
  when: aun_layout | bool

- name: Cockpit-Anmeldeseite
  ansible.builtin.copy:
    dest: /etc/cockpit/cockpit.conf
    content: |
      # Von aunserver verwaltet (Ansible), Änderungen werden überschrieben.
      [WebService]
      LoginTitle={{ hostname }} (aunserver)
      # Origins ERSETZT die Standardregel (nur eigene Adresse), deshalb stehen hier beide Wege:
      # über Caddy und direkt über :9090 als Rettungsweg, falls Docker/Caddy nicht laufen (M4-Test)
      Origins = https://cockpit.{{ domain }} https://{{ ansible_facts.default_ipv4.address }}:9090 https://{{ hostname }}:9090 https://{{ domain }}:9090
      ProtocolHeader = X-Forwarded-Proto
    owner: root
    group: root
    mode: "0644"
  notify: Cockpit neu starten

- name: Cockpit lauscht auf Port 9090
  ansible.builtin.systemd_service:
    name: cockpit.socket
    enabled: true
    state: started
