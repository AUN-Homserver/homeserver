---
- name: NAS einrichten
  hosts: localhost
  connection: local
  become: true
  pre_tasks:
    - name: Konfiguration prüfen
      ansible.builtin.assert:
        that:
          - admin_user != 'root'
          - not (apps.tailscale and apps.wireguard)
        fail_msg: "admin_user darf nicht root sein, und nur eines von tailscale/wireguard ist erlaubt."
        quiet: true

    # vor der Firewall (Rolle security), die lan_port übernimmt
    - name: Einträge in caddy_eigene_seiten prüfen
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.keys() | difference(['name', 'port', 'lan_port', 'geschuetzt', 'aun_symbol']) | length == 0
          - item.name is defined and item.name is string and item.name is match('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$')
          - item.port is defined and item.port is integer and item.port >= 1 and item.port <= 65535
          - item.lan_port is not defined or (item.lan_port is integer and item.lan_port >= 1 and item.lan_port <= 65535)
          - item.geschuetzt is not defined or item.geschuetzt is boolean
          - item.aun_symbol is not defined or item.aun_symbol is boolean
        fail_msg: >-
          caddy_eigene_seiten: ungültiger Eintrag {{ item }}. Erlaubt sind name (Kleinbuchstaben, Ziffern, Bindestrich),
          port und lan_port (Zahl 1-65535), geschuetzt und aun_symbol (true/false).
        quiet: true
      loop: "{{ caddy_eigene_seiten }}"
      loop_control:
        label: "{{ item.name | default(item) }}"

    - name: Namen und LAN-Ports in caddy_eigene_seiten sind eindeutig
      ansible.builtin.assert:
        that:
          - namen | unique | length == namen | length
          - lan | unique | length == lan | length
          - lan | intersect(stacks_lan_ports.values() | list) | length == 0
        fail_msg: "caddy_eigene_seiten: doppelter Name oder lan_port, oder lan_port schon in stacks_lan_ports belegt."
        quiet: true
      vars:
        namen: "{{ caddy_eigene_seiten | map(attribute='name') | list }}"
        lan: "{{ caddy_eigene_seiten | selectattr('lan_port', 'defined') | map(attribute='lan_port') | list }}"

    - name: Benutzerdaten des Admin-Benutzers lesen
      ansible.builtin.getent:
        database: passwd
        key: "{{ admin_user }}"
      failed_when: false

    - name: UID und GID für Container setzen
      ansible.builtin.set_fact:
        puid: "{{ getent_passwd[admin_user][1] }}"
        pgid: "{{ getent_passwd[admin_user][2] }}"
      when: getent_passwd[admin_user] is defined

  roles:
    - base
    - security
    - storage
    - docker
    - cockpit
    - samba
    - network
    - stacks
    - backup
    - update

  post_tasks:
    # am Ende, damit auch das Backup-Passwort und der Tailscale-Zustand drinstehen
    - name: Übersicht der Zugänge
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../stacks/zugaenge.txt.j2"
        dest: /etc/aunserver/zugaenge.txt
        owner: root
        group: root
        mode: "0600"

    # Hinweis aufs Setup aus dem Installer: nach erfolgreicher Einrichtung überflüssig. Er prüfte
    # /etc/aunserver/config.yml, das Verzeichnis ist aber nur für root lesbar (0700), daher
    # erschien er für den Admin auch nach der Einrichtung
    - name: Login-Hinweis aufs Setup entfernen
      ansible.builtin.file:
        path: /etc/profile.d/aunserver.sh
        state: absent
